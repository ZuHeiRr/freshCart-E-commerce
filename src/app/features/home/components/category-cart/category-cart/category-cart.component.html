<a
  class="group relative block overflow-hidden rounded-2xl bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl min-h-80"
  [routerLink]="['/categories', cate()._id]"
>
  <div class="relative aspect-[4/3] overflow-hidden">
    <img
      [src]="cate().image"
      alt="Music"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
    />

    <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
  </div>

  <div class="flex items-center justify-between p-4">
    <div>
      <span class="text-[10px] uppercase tracking-[2px] text-gray-400 font-semibold">
        {{ 'Explore category' | translate }}
      </span>

      <h3
        class="mt-1 text-xl font-bold tracking-tight text-gray-900 group-hover:text-primary transition-colors"
      >
        {{ cate().name | translate }}
      </h3>
    </div>

    <div
      class="w-11 h-11 rounded-full border border-gray-200 flex items-center justify-center transition-all duration-300 group-hover:bg-primary group-hover:text-white group-hover:border-primary"
    >
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </div>
  </div>
</a>
